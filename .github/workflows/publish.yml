name: Publish

# Publishes n8n-nodes-coretool to npm with provenance via npm Trusted Publishing (OIDC).
# No NPM_TOKEN secret is needed: the trusted publisher (coretool-de/n8n-nodes-coretool, publish.yml)
# must be configured on npmjs.com. Triggered by a version tag (e.g. 0.1.0) or a published GitHub release.

on:
  push:
    tags:
      - '*.*.*'
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for npm provenance / trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Ensure npm 11.5.1 or newer (trusted publishing)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        # API tests only run when CORETOOL_TEST_KEY is set; without it the script exits 0 in CI.
        run: npm test
        env:
          CI: 'true'
          CORETOOL_TEST_KEY: ${{ secrets.CORETOOL_TEST_KEY }}

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"; exit 1
          fi

      # Normal case: npm Trusted Publishing (OIDC), no token at all.
      - name: Publish to npm with provenance (trusted publishing)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: npm publish --provenance --access public

      # Only for the very first release, if npm does not yet allow a trusted publisher for an
      # unpublished package name: set a short-lived granular token as repository secret NPM_TOKEN,
      # publish once (still with provenance), then add the trusted publisher and delete the secret.
      - name: Publish to npm with provenance (token, first release only)
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
